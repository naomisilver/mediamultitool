[app]
# if you get errors on any informationn you place inside this file
# ensure that they're placed in single quotes as apposed to double quotes

# you only need the API keys for the services you want to convert playlists from
[app.apis]
# last.fm api key used only when tracks and artists when retrieving playlist data from last.fm
lastfm_api_key = ''

# all common enviroment variables necessary across multiple tools
[app.core]
# the local path to your music library, either absolute path or network path
# (e.g., \\10.0.0.2\\path\to\music or C:\path\to\music)
local_music_path = ''

# default output directory for the various files generated by mediamultitool
default_output = ''

[app.playlist]
# the root volume of your music service container (i.e., Navidrome)
container_root = '/music/'

# both work in the same way, where blocklist_strings is string to mever match (e.g., "(Live)")
# allowlist_strings will retain the string in track (if found) (e.g., "(English ver.)")
# seperate the strings using a comma (e.g., "(Live), (English ver.)") 
blocklist_strings = ''
allowlist_strings = ''

# below is where you should define alternative names for artists you find while using mmt
# in the case where the artist "30 Seconds To Mars" is stored locally but in the playlist
# data, it's defined as "Thirty Seconds To Mars" (you do not need to include the inverse order of names)
[app.playlist.artist_aliases]
"30 Seconds To Mars" = "Thirty Seconds To Mars"

[app.cleaner]
# location of where you download/rip your albums to
download_path = ''

[app.updater]
# all album types to ignore when updating (this only affects what is outputted to you, all data is cached
# anyway so checking for just singles of your collection after checking for studio albums will be significantly
# faster) accepts only "true" or "false". Personally would recommend only outputting one type at a time as there
# can be false positives when retrieving album data.
ignore_studio_albums = false
ignore_eps = true
ignore_singles = true
ignore_compilations = true
ignore_live_albums = true

# below is a way you can "set it and forget it", it accept either 'new' or 'all' where new will only show you
# albums newer than newest one you have locally, and all will show you every album you're missing from an artist's
# discography (please bare in mind, for massive collections and/or with many non-ignored album types, there will
# be ALOT of information for you to sift through) (if no input is given on the command line, or here, it will default
# to only showing new) this can be overridden by giving -new or -all when running updater
check_new_or_all = ''

# excluded list is a list of the directories you want to prevent matching for, you also have the option to do this on the
# command line too with --excluding however this allows to exclude permanent fixtures of your library like "Various Artists"
# or "Artist Collection". Seperate entries here using a command (,)
excluded = 'Various Artists, Playlists'

# required when downloading music from deezer, to get your token, follow this guide:
# https://github.com/nathom/streamrip/wiki/Finding-Your-Deezer-ARL-Cookie
deezer_arl_token = ''

# this determines which source to download music from. Currently only Deezer is supported with plans to support Qobuz
# in the future.
download_source = 'deezer'

[app.misc]
# versioning DO NOT CHANGE
version = '0.1.5'
